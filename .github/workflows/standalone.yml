name: standalone

# The standalone host distribution (gateway issue #283, increment I1): the
# same gate triple the SDK job runs, scoped to the standalone/ subtree —
# its own pyproject, its own lock, its own dev-only path dependency on the
# SDK package beside it. Single python 3.13 lane by design (the design
# record's CI-cost section); the SDK job's OS matrix covers the shared
# read_file/symlink semantics this subtree inherits unchanged.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "standalone/**"
      - ".github/workflows/standalone.yml"

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: standalone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Sync environment
        run: uv sync --locked --extra test

      - name: Lint
        run: |
          uv run ruff check .
          rm -rf .mypy_cache
          uv run mypy

      - name: Tests
        run: uv run pytest -q --junitxml=../.reports/junit.xml

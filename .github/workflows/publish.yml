name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (must match project.version)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and universal wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the release tag / dispatch tag: never build the default branch.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Standards self-check
        run: uv run benchweave-sdk sync-standards --check
      - name: Build wheel and sdist
        # hatch_build verifies the vendored standards tree and preview assets
        # against the lock during the build, so a stale tree cannot reach PyPI.
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Installed wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install smoke (wheel outside any checkout)
        # $RUNNER_TEMP is a real (non-symlink) path on every runner OS —
        # the SDK's path validation rejects symlinked roots like macOS /tmp.
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/sdk-smoke"
          uv pip install --python "$RUNNER_TEMP/sdk-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/sdk-smoke/bin/benchweave-sdk" --version | grep -F "version ${TAG#v}"
          "$RUNNER_TEMP/sdk-smoke/bin/benchweave-sdk" new "$RUNNER_TEMP/example" --with-ui
          "$RUNNER_TEMP/sdk-smoke/bin/benchweave-sdk" check "$RUNNER_TEMP/example/src/example_plugin/descriptor.json"

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Tag must match project.version
        run: uv run --no-project python scripts/verify_release_tag.py "${{ github.event.release.tag_name || inputs.tag }}" --pyproject pyproject.toml
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

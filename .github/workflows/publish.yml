name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (must match project.version)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and universal wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the release tag / dispatch tag: never build the default branch.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Standards self-check
        run: uv run benchweave-sdk sync-standards --check
      - name: Build wheel and sdist
        # hatch_build verifies the vendored standards tree and preview assets
        # against the lock during the build, so a stale tree cannot reach PyPI.
        run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Installed wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Install smoke (wheel outside any checkout)
        # $RUNNER_TEMP is a real (non-symlink) path on every runner OS —
        # the SDK's path validation rejects symlinked roots like macOS /tmp.
        # bash everywhere: the Windows runner otherwise defaults to pwsh,
        # and its venv puts entry points under Scripts/, not bin/.
        shell: bash
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/sdk-smoke"
          BIN="$RUNNER_TEMP/sdk-smoke/bin"
          [ -d "$BIN" ] || BIN="$RUNNER_TEMP/sdk-smoke/Scripts"
          # --python takes the venv directory, not "$BIN/python": on Windows the
          # interpreter is python.exe and uv does not append the suffix, whereas
          # bash does resolve the suffix-less entry points used below.
          uv pip install --python "$RUNNER_TEMP/sdk-smoke" dist/*.whl
          "$BIN/benchweave-sdk" --version | grep -F "version ${TAG#v}"
          "$BIN/benchweave-sdk" new "$RUNNER_TEMP/example" --with-ui
          "$BIN/benchweave-sdk" check "$RUNNER_TEMP/example/src/example_plugin/descriptor.json"
          # Installed-mode standards verification: proves the packaged lock
          # (the wheel force-include) and the resource path in
          # verify_installed before anything reaches PyPI.
          "$BIN/benchweave-sdk" sync-standards --check

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Tag must match project.version
        run: uv run --no-project python scripts/verify_release_tag.py "${{ github.event.release.tag_name || inputs.tag }}" --pyproject pyproject.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  tap:
    name: bump homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # don't fail the release if the tap token isn't set yet
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — for the formula template at .github/homebrew/benchweave-sdk.rb.tmpl
      - name: Render Formula/benchweave-sdk.rb from the template and push to madeinoz67/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set; skipping Homebrew tap bump. Add a PAT (contents:write on madeinoz67/homebrew-tap) as the HOMEBREW_TAP_TOKEN repo secret to enable."
            exit 0
          fi
          ver="${TAG#v}"
          # PyPI's JSON API may lag the publish job completing — retry briefly.
          json=""
          for i in 1 2 3 4 5 6; do
            if json=$(curl -fsSL "https://pypi.org/pypi/benchweave-sdk/${ver}/json"); then
              break
            fi
            echo "PyPI JSON not ready for ${ver} (attempt ${i}); retrying in 10s"
            sleep 10
          done
          [ -n "$json" ] || { echo "::error::PyPI JSON for ${ver} never became available"; exit 1; }
          url=$(echo "$json" | jq -r '.urls[] | select(.packagetype=="sdist") | .url')
          sha256=$(echo "$json" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')
          [ -n "$url" ] && [ -n "$sha256" ] && [ "$url" != "null" ] && [ "$sha256" != "null" ] \
            || { echo "::error::no sdist found for ${ver} on PyPI"; exit 1; }
          sed -e "s|__URL__|${url}|" -e "s|__SHA256__|${sha256}|" \
              .github/homebrew/benchweave-sdk.rb.tmpl > /tmp/benchweave-sdk.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/madeinoz67/homebrew-tap" tap
          mkdir -p tap/Formula
          mv /tmp/benchweave-sdk.rb tap/Formula/benchweave-sdk.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "benchweave-sdk ${ver}" || echo "no formula changes"
          git push

  changelog:
    name: Changelog (release notes + CHANGELOG.md)
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check changelog app wiring
        id: wiring
        run: |
          if [ -z "${{ vars.CHANGELOG_APP_ID }}" ]; then
            echo "::warning::CHANGELOG_APP_ID variable not set — skipping CHANGELOG.md commit. Register the changelog GitHub App, install it on this repo, then set CHANGELOG_APP_ID + CHANGELOG_APP_PRIVATE_KEY."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create changelog app token
        if: steps.wiring.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.wiring.outputs.ready == 'true' && steps.app-token.outputs.token || github.token }}
      - name: Generate notes for this release
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          # Activates git-cliff's remote integration: commit emails resolve to
          # GitHub usernames, so the Contributors section renders @mentions.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Replace the release body with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
      - name: Regenerate the full CHANGELOG.md
        if: steps.wiring.outputs.ready == 'true'
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit CHANGELOG.md to main
        if: steps.wiring.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md already up to date"
            exit 0
          fi
          cp CHANGELOG.md /tmp/CHANGELOG.md
          git checkout main
          cp /tmp/CHANGELOG.md CHANGELOG.md
          git add CHANGELOG.md
          # [skip ci] is load-bearing: app-token pushes DO trigger workflows
          # (GITHUB_TOKEN pushes do not) — without it the changelog commit
          # re-runs the full ci suite on a CHANGELOG.md-only commit.
          git commit -m "chore(changelog): update for $TAG [skip ci]"
          git push origin HEAD:main

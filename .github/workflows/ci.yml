name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the regression proof for the portable read_file
        # path and the .gitattributes LF policy the standards digests rely on.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Deliberately NO submodules: this lane proves the SDK repository is
      # self-contained and never reads the gateway checkout.
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync environment
        run: uv sync --locked --extra test

      - name: Lint
        run: |
          uv run ruff check .
          uv run mypy src

      - name: Tests
        run: uv run pytest -q

      - name: Standards self-check
        # lock <-> vendored tree <-> stamps with no bundle: the committed
        # state alone. The compatibility-matrix staleness gate is
        # deliberately NOT here: this repository has no standards manifest,
        # so a lock-only matrix would duplicate the gate that the main
        # repository runs (make check-sdk-standards: standards check +
        # matrix --check). Docs publishing is likewise carried by the main
        # repository's ui/gates jobs.
        run: uv run benchweave-sdk sync-standards --check

      - name: CLI entry point
        run: uv run benchweave-sdk --version

      - name: Scaffold and check a plugin end-to-end
        # Exercises the file-reading CLI paths (new --with-ui, check,
        # check-ui) on every OS in the matrix — the paths that were
        # unusable on Windows before the portable read_file.
        shell: bash
        run: |
          uv run benchweave-sdk new "$RUNNER_TEMP/ci-demo" --package ci_demo --with-ui
          uv run benchweave-sdk check "$RUNNER_TEMP/ci-demo/src/ci_demo/descriptor.json"
          uv run benchweave-sdk check-ui "$RUNNER_TEMP/ci-demo/src/ci_demo/presentation.json" \
            --descriptor "$RUNNER_TEMP/ci-demo/src/ci_demo/descriptor.json" \
            --resources "$RUNNER_TEMP/ci-demo/src/ci_demo" \
            --catalogue "$RUNNER_TEMP/ci-demo/src/ci_demo/binding-catalogue.json"

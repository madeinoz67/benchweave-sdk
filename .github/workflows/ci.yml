name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the regression proof for the portable read_file
        # path and the .gitattributes LF policy the standards digests rely on.
        # macos-latest runs the suite on Darwin, where open and symlink
        # semantics differ from Linux in places (O_NOFOLLOW errno, the
        # symlinked /tmp the publish smoke works around); the release smoke
        # already runs there, so the unit suite should too.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # bash on every OS. pwsh, the Windows default, reports only the LAST
        # command's exit code from a multi-line run, so a failing `ruff check`
        # followed by a passing `mypy` left the Windows lane green.
        shell: bash
    steps:
      # Deliberately NO submodules: this lane proves the SDK repository is
      # self-contained and never reads the gateway checkout.
      # fetch-depth 0: the R-4 update lane (tests/test_scaffold_update.py)
      # walks this checkout's own template history (rev-list) to find its
      # BASE state — a shallow clone truncates that walk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Sync environment
        # --extra scaffold (WS2: the copier template render + update lane run
        # on every push); --extra server (the folded standalone host, #309).
        run: uv sync --locked --extra test --extra server --extra scaffold

      - name: Lint
        # Bare mypy — config-driven ([tool.mypy] files = src plus
        # scripts/claim_lane.py since fold-1 ride a); an explicit path
        # argument would silently drop the lane module from the gate.
        run: |
          uv run ruff check .
          uv run mypy

      - name: Tests
        # The browser lane is marker-partitioned (I2a NFR-Q1): its Playwright
        # chromium + axe run in the dedicated browser job below; everywhere
        # else the marker is deselected so a missing browser never reds the
        # unit lanes. -n auto (issue #402, owner redirect 2026-10-05): the
        # serial suite outgrew the 15m job ceiling on windows-latest (Tests
        # step alone >14m35s, killed mid-suite, on a 40-line merge) — a suite
        # that needs 15 minutes is the defect, so the suite parallelises
        # rather than the ceiling rising. Timing-marked tests (the AR-2 soak
        # asserts wall-clock structural bounds) run serial and unloaded after
        # the parallel leg — the gateway's #247/#280 pattern: order-dependence
        # and load-sensitivity surface HERE first, at PR time, in every lane.
        # The `loop` marker is the same partition for cost, not flakes: that
        # module builds a wheel and a venv per pytest session, so under -n auto
        # every xdist worker holding one of its tests repeated the build. It
        # runs in the ubuntu-only serial step below (design record §13).
        run: |
          uv run pytest -q -m "not browser and not timing and not loop and not live_ftdi" -n auto
          uv run pytest -q -m "timing"

      - name: "Standalone dev loop — serial, ubuntu-only (issue #556)"
        # The pre-committed fallback for the CI budget (design record §13).
        # The module's session fixtures build this repository's wheel and a
        # fresh venv, so the parallel leg above deselects the `loop` marker and
        # this one-worker run is where the installed-wheel loop is measured.
        # It stays in CI — never vacuous — but macOS and Windows no longer run
        # it; §13 records what that gives up. No -n: one worker by design. A
        # selection that matches no test exits 5, so a marker that stopped
        # selecting the module reds this step instead of passing quietly.
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest -q -m loop

      - name: Standards self-check
        # lock <-> vendored tree <-> stamps with no bundle: the committed
        # state alone. The compatibility-matrix staleness gate is
        # deliberately NOT here: this repository has no standards manifest,
        # so a lock-only matrix would duplicate the gate that the main
        # repository runs (make check-sdk-standards: standards check +
        # matrix --check). Docs publishing is likewise carried by the main
        # repository's ui/gates jobs.
        run: uv run benchweave-sdk sync-standards --check

      - name: Version-literal zero gate
        # Issue #221 (gateway #203 slice 7): an SDK-only PR cannot add a
        # version literal between gateway pointer bumps — this lane refuses
        # it immediately, and the gateway's sdk scope re-checks the same
        # tree at every bump (the A6 two-sided posture). The counter is
        # stdlib-only; the definition's authority and the register-sync
        # obligation live in the gateway repo.
        run: python3 scripts/count_version_literals.py

      - name: CLI entry point
        run: uv run benchweave-sdk --version

      - name: Scaffold and check a plugin end-to-end
        # Exercises the file-reading CLI paths (new --with-ui, check,
        # check-ui) on every OS in the matrix — the paths that were
        # unusable on Windows before the portable read_file.
        shell: bash
        run: |
          uv run benchweave-sdk new "$RUNNER_TEMP/ci-demo" --package ci_demo --with-ui
          uv run benchweave-sdk check "$RUNNER_TEMP/ci-demo/src/ci_demo/descriptor.json"
          uv run benchweave-sdk check-ui "$RUNNER_TEMP/ci-demo/src/ci_demo/presentation.json" \
            --descriptor "$RUNNER_TEMP/ci-demo/src/ci_demo/descriptor.json" \
            --resources "$RUNNER_TEMP/ci-demo/src/ci_demo" \
            --catalogue "$RUNNER_TEMP/ci-demo/src/ci_demo/binding-catalogue.json"
          # #596: run the generated workflow's exact lint path against the
          # freshly scaffolded project. UV_FIND_LINKS supplies THIS checkout's
          # wheel for the generated test extra's `==` pin, because uv locks
          # every extra on any sync (measured: `uv sync --extra lint` refuses
          # when the test extra's pin is unresolvable). Without it this step
          # would red main for the whole version-bump window, where the pin
          # names a version PyPI cannot serve until the release publishes.
          uv build --wheel --out-dir "$RUNNER_TEMP/ci-dist"
          export UV_FIND_LINKS="$RUNNER_TEMP/ci-dist"
          cd "$RUNNER_TEMP/ci-demo"
          uv sync --extra lint
          uv run ruff check .

      - name: Installed-wheel smoke (the publish workflow's block, at PR time)
        # publish.yml's smoke lane runs only at release, so a mistake in it
        # surfaces when it is most expensive: its Windows install line was
        # wrong for a whole review round and nothing could have noticed. The
        # same commands run here on every OS in the matrix — including the
        # preview-ui default-install refusal arm (#308) — and publish's
        # ubuntu-only [server] banner smoke has its own ubuntu-only mirror
        # step below, so every release-time arm has a PR-time twin.
        shell: bash
        run: |
          set -euo pipefail
          uv build --out-dir smoke-dist
          uv venv "$RUNNER_TEMP/sdk-smoke"
          BIN="$RUNNER_TEMP/sdk-smoke/bin"
          [ -d "$BIN" ] || BIN="$RUNNER_TEMP/sdk-smoke/Scripts"
          # [scaffold] rides the wheel install too: `new` from the installed
          # wheel renders through the packaged copier template (WS2). The glob
          # must expand BEFORE the extras suffix is appended: a quoted
          # glob-plus-extras reaches uv as a literal and it refuses with
          # "The wheel filename '*.whl' is invalid".
          WHEEL="$(echo smoke-dist/*.whl)"
          uv pip install --python "$RUNNER_TEMP/sdk-smoke" "${WHEEL}[scaffold]"
          "$BIN/benchweave-sdk" --version
          # PR #90 carry-forward row R1: the server console script exists on
          # every default install (extras cannot gate entry points) — smoke
          # it here so a packaging regression that breaks it fails at PR
          # time, not at release. --version needs no [server] extra.
          "$BIN/benchweave-sdk-server" --version
          "$BIN/benchweave-sdk" new "$RUNNER_TEMP/smoke-example" --with-ui
          "$BIN/benchweave-sdk" check "$RUNNER_TEMP/smoke-example/src/example_plugin/descriptor.json"
          # B-F5 completeness: the wheel render must equal the committed fixture
          # byte-for-byte, so a force-include regression dropping ANY template
          # member (vectors.json, ...) reddens here instead of shipping green.
          "$BIN/python" - "$RUNNER_TEMP/smoke-example" <<'PY'
          import sys
          from pathlib import Path

          rendered = Path(sys.argv[1]).resolve()
          fixture = Path("tests/fixtures/scaffold_expected/ui")
          a = {
              p.relative_to(rendered).as_posix(): p.read_bytes()
              for p in rendered.rglob("*")
              if p.is_file() and "__pycache__" not in p.parts
          }
          b = {
              p.relative_to(fixture).as_posix(): p.read_bytes()
              for p in fixture.rglob("*")
              if p.is_file() and "__pycache__" not in p.parts
          }
          assert sorted(a) == sorted(b), (
              f"file sets differ; missing: {sorted(set(b) - set(a))}, "
              f"unexpected: {sorted(set(a) - set(b))}"
          )
          for key in sorted(b):
              assert a[key] == b[key], f"bytes differ: {key}"
          print(f"wheel render == fixture ({len(b)} files)")
          PY
          "$BIN/benchweave-sdk" sync-standards --check
          # #308 A2 (publish's arm, mirrored at PR time): preview-ui on a
          # [server]-less install refuses through serve's own guard — exit 2,
          # prefix + install command, never a traceback. The [scaffold]
          # install above still carries no [server] extra, which is the axis
          # this arm proves against.
          set +e
          err=$("$BIN/benchweave-sdk" preview-ui "$RUNNER_TEMP/smoke-example" 2>&1)
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "::error::preview-ui exited $code on the server-less install (expected 2)"; echo "$err"; exit 1; }
          echo "$err" | grep -F "benchweave_sdk_server_extras_missing:" \
            || { echo "::error::preview-ui refusal is missing the prefix"; exit 1; }
          echo "$err" | grep -F "benchweave-sdk[server]" \
            || { echo "::error::preview-ui refusal is missing the install command"; exit 1; }
          case "$err" in *Traceback*)
            echo "::error::preview-ui refusal printed a traceback"; exit 1;; esac

      - name: Generated workflow — A0 green legs and A7 earned-[server] control (issue #596)
        # The design record's §8 execution arms, run at PR time because no
        # release is scheduled (a proof parked at a release gate is parked
        # indefinitely):
        #   A0  a freshly generated project passes BOTH of its own workflow's
        #       job commands. Denominator: 3 arms x 2 jobs. The baseline this
        #       improves on was measured against the pre-#596 template: lint
        #       failed on every arm as a TOOLING error (exit 2, no lint extra
        #       to name), provider tests failed 5/8 with
        #       live_provider_backend_missing, and base (9/9) and ui (10/10)
        #       already passed — those two are the must-not-regress baseline,
        #       not a red to manufacture.
        #   A7  the provider arm's [server] pin is EARNED, proven by execution
        #       in both directions. The stripped-pin leg is a STANDING
        #       EXPECTED-FAILURE control (the R-5c planted-violation pattern):
        #       it reds the day the stripped run goes green, which is the day
        #       D1 lands and the template pin must narrow to the bare form.
        # Ubuntu only: four scaffolded projects, each resolving its own
        # environment. The ui lint leg also runs on every lane in the step
        # above; here it completes A0's 3 x 2 denominator.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          DIST="$PWD/smoke-dist"   # built by the installed-wheel smoke step above
          ROOT="$RUNNER_TEMP/generated-workflow"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          uv run benchweave-sdk new "$ROOT/base" --package example_plugin
          uv run benchweave-sdk new "$ROOT/ui" --package example_plugin --with-ui
          uv run benchweave-sdk new "$ROOT/provider" --package example_plugin --provider-transport
          uv run benchweave-sdk new "$ROOT/provider-stripped" --package example_plugin --provider-transport
          # A7's one mutated variable, and nothing else. UV_FIND_LINKS makes
          # the wheel built above resolvable, but it is NOT the only source
          # whenever the dev version equals the latest published release (PyPI
          # served 0.24.0 while this branch was built on it). With no lock,
          # uv prefers the flat index; the export therefore precedes every
          # sync below, and each sync is followed by a lock-source assertion
          # so the legs cannot silently exercise PyPI's bytes instead.
          sed 's/benchweave-sdk\[server\]==/benchweave-sdk==/' \
            "$ROOT/provider-stripped/pyproject.toml" > "$ROOT/provider-stripped/pyproject.toml.tmp"
          mv "$ROOT/provider-stripped/pyproject.toml.tmp" "$ROOT/provider-stripped/pyproject.toml"
          grep -qF 'test = ["benchweave-sdk==' "$ROOT/provider-stripped/pyproject.toml" \
            || { echo "::error::the [server] strip did not apply — the control would run the wrong project"; exit 1; }
          export UV_FIND_LINKS="$DIST"

          # Exit-code law (design record §8): 0 is green, 1 is findings, 2 is
          # the TOOLING class (uv usage error, undefined extra, spawn failure)
          # and never reads as "the check ran". Naming the class is the arm.
          classify() {
            case "$1" in
              0) echo "green";;
              1) echo "exit 1 (findings)";;
              2) echo "exit 2 (tooling class: uv usage/spawn/undefined extra)";;
              5) echo "exit 5 (pytest collected nothing)";;
              *) echo "exit $1";;
            esac
          }

          # Sets OUT and CODE without tripping errexit.
          CODE=0
          OUT=""
          capture_in() {
            local dir="$1"
            shift
            CODE=0
            OUT=$( cd "$dir" && "$@" 2>&1 ) || CODE=$?
          }

          run_job() {
            # $1 = project dir, $2 = extra, $3 = passed floor ("" for lint),
            # rest = the workflow job's command, verbatim.
            local dir="$1" extra="$2" floor="$3" passed
            shift 3
            capture_in "$dir" uv sync --extra "$extra"
            if [ "$CODE" -ne 0 ]; then
              printf '%s\n' "$OUT"
              echo "::error::$dir: uv sync --extra $extra failed — $(classify "$CODE")"
              exit 1
            fi
            # The pin must resolve to the wheel THIS lane built, not to the
            # release PyPI happens to carry under the same version. uv records
            # the winning index in the lock it writes, so the claim is
            # checked rather than assumed: a pre-existing lock (or a future
            # reordering that syncs before the export) would silently swap
            # the bytes under test.
            if ! grep -qF "registry = \"$DIST\"" "$dir/uv.lock"; then
              echo "::error::$dir: uv.lock does not resolve benchweave-sdk from $DIST — this leg would exercise PyPI's bytes, not the wheel under test"
              exit 1
            fi
            capture_in "$dir" uv run "$@"
            if [ "$CODE" -ne 0 ]; then
              printf '%s\n' "$OUT"
              echo "::error::$dir: the generated job ($*) is not green — $(classify "$CODE")"
              exit 1
            fi
            if [ -n "$floor" ]; then
              passed=$(printf '%s\n' "$OUT" | grep -oE '[0-9]+ passed' | tail -1 | grep -oE '^[0-9]+') || true
              if [ -z "$passed" ] || [ "$passed" -lt "$floor" ]; then
                printf '%s\n' "$OUT"
                echo "::error::$dir: passed count ${passed:-none} is below the $floor floor (exit 5 or a vanished suite)"
                exit 1
              fi
              echo "$dir: $* -> exit 0, $passed passed"
            else
              echo "$dir: $* -> exit 0"
            fi
          }

          run_job "$ROOT/base" lint "" ruff check .
          run_job "$ROOT/ui" lint "" ruff check .
          run_job "$ROOT/provider" lint "" ruff check .
          run_job "$ROOT/base" test 9 pytest -q
          run_job "$ROOT/ui" test 10 pytest -q
          run_job "$ROOT/provider" test 8 pytest -q

          # A7 (i): the stripped-pin control MUST fail as findings with the
          # backend refusal. Green here means the [server] pin stopped earning
          # its place; exit 2 here means the control proved nothing.
          capture_in "$ROOT/provider-stripped" uv sync --extra test
          if [ "$CODE" -ne 0 ]; then
            printf '%s\n' "$OUT"
            echo "::error::provider-stripped: uv sync --extra test failed — $(classify "$CODE")"
            exit 1
          fi
          grep -qF "registry = \"$DIST\"" "$ROOT/provider-stripped/uv.lock" || {
            echo "::error::provider-stripped: uv.lock does not resolve benchweave-sdk from $DIST — the control would prove the wrong wheel"
            exit 1
          }
          capture_in "$ROOT/provider-stripped" uv run pytest -q
          printf '%s\n' "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "::error::the [server]-stripped provider suite PASSED. The template pin is no longer earned: drop the extras clause from the generated test extra in template/pyproject.toml.jinja (design record §2.2), regenerate the fixtures, and re-cut the record's A7."
            exit 1
          fi
          if [ "$CODE" -ne 1 ]; then
            echo "::error::the [server]-stripped provider suite failed as $(classify "$CODE"), not as findings — the control proves nothing outside exit 1"
            exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -qF "live_provider_backend_missing"; then
            echo "::error::the [server]-stripped provider suite failed without live_provider_backend_missing — the pin may be required for a different reason, or the refusal changed"
            exit 1
          fi
          echo "provider-stripped: exit 1 with live_provider_backend_missing — the [server] pin is earned"

      - name: Server smoke — preview-ui over the installed wheel (publish's ubuntu arm, at PR time)
        # #308: publish.yml's ubuntu-only [server] smoke (spawn preview-ui,
        # poll the banners, SIGINT exits 0), mirrored here so its shape is
        # proven before the release event too. Ubuntu-only for the same
        # reason publish's is: one OS proves the installed shape; the
        # Windows/macOS entry-point presence is covered by the step above.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/server-smoke"
          SBIN="$RUNNER_TEMP/server-smoke/bin"
          WHEEL="$(echo smoke-dist/*.whl)"
          uv pip install --python "$RUNNER_TEMP/server-smoke" "${WHEEL}[server]"
          "$SBIN/benchweave-sdk" new "$RUNNER_TEMP/server-example" --with-ui
          PORT=18477
          "$SBIN/benchweave-sdk" preview-ui "$RUNNER_TEMP/server-example" --no-open --port "$PORT" &
          PID=$!
          body="$RUNNER_TEMP/server-smoke-body.html"
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/" -o "$body"; then break; fi
            sleep 1
          done
          grep -F "SIMULATED PRESENTATION DATA" "$body"
          grep -F "NO GATEWAY · LOCAL PRESENTATION ONLY" "$body"
          kill -INT "$PID"
          wait "$PID"

  browser:
    # The axe/Playwright lane (I2a NFR-Q1): the real app factory over the
    # mock transport, every page template in both themes (data-theme
    # forced), the doctored-template RED control and the plot-hydration
    # assertions.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --locked --extra test --extra server
      - name: Install chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser lane
        run: uv run pytest -q -m browser tests/server

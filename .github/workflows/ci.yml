name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the regression proof for the portable read_file
        # path and the .gitattributes LF policy the standards digests rely on.
        # macos-latest runs the suite on Darwin, where open and symlink
        # semantics differ from Linux in places (O_NOFOLLOW errno, the
        # symlinked /tmp the publish smoke works around); the release smoke
        # already runs there, so the unit suite should too.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # bash on every OS. pwsh, the Windows default, reports only the LAST
        # command's exit code from a multi-line run, so a failing `ruff check`
        # followed by a passing `mypy` left the Windows lane green.
        shell: bash
    steps:
      # Deliberately NO submodules: this lane proves the SDK repository is
      # self-contained and never reads the gateway checkout.
      # fetch-depth 0: the R-4 update lane (tests/test_scaffold_update.py)
      # walks this checkout's own template history (rev-list) to find its
      # BASE state — a shallow clone truncates that walk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Sync environment
        # --extra scaffold (WS2: the copier template render + update lane run
        # on every push); --extra server (the folded standalone host, #309).
        run: uv sync --locked --extra test --extra server --extra scaffold

      - name: Lint
        run: |
          uv run ruff check .
          uv run mypy src

      - name: Tests
        # The browser lane is marker-partitioned (I2a NFR-Q1): its Playwright
        # chromium + axe run in the dedicated browser job below; everywhere
        # else the marker is deselected so a missing browser never reds the
        # unit lanes.
        run: uv run pytest -q -m "not browser"

      - name: Standards self-check
        # lock <-> vendored tree <-> stamps with no bundle: the committed
        # state alone. The compatibility-matrix staleness gate is
        # deliberately NOT here: this repository has no standards manifest,
        # so a lock-only matrix would duplicate the gate that the main
        # repository runs (make check-sdk-standards: standards check +
        # matrix --check). Docs publishing is likewise carried by the main
        # repository's ui/gates jobs.
        run: uv run benchweave-sdk sync-standards --check

      - name: Version-literal zero gate
        # Issue #221 (gateway #203 slice 7): an SDK-only PR cannot add a
        # version literal between gateway pointer bumps — this lane refuses
        # it immediately, and the gateway's sdk scope re-checks the same
        # tree at every bump (the A6 two-sided posture). The counter is
        # stdlib-only; the definition's authority and the register-sync
        # obligation live in the gateway repo.
        run: python3 scripts/count_version_literals.py

      - name: CLI entry point
        run: uv run benchweave-sdk --version

      - name: Scaffold and check a plugin end-to-end
        # Exercises the file-reading CLI paths (new --with-ui, check,
        # check-ui) on every OS in the matrix — the paths that were
        # unusable on Windows before the portable read_file.
        shell: bash
        run: |
          uv run benchweave-sdk new "$RUNNER_TEMP/ci-demo" --package ci_demo --with-ui
          uv run benchweave-sdk check "$RUNNER_TEMP/ci-demo/src/ci_demo/descriptor.json"
          uv run benchweave-sdk check-ui "$RUNNER_TEMP/ci-demo/src/ci_demo/presentation.json" \
            --descriptor "$RUNNER_TEMP/ci-demo/src/ci_demo/descriptor.json" \
            --resources "$RUNNER_TEMP/ci-demo/src/ci_demo" \
            --catalogue "$RUNNER_TEMP/ci-demo/src/ci_demo/binding-catalogue.json"

      - name: Installed-wheel smoke (the publish workflow's block, at PR time)
        # publish.yml's smoke lane runs only at release, so a mistake in it
        # surfaces when it is most expensive: its Windows install line was
        # wrong for a whole review round and nothing could have noticed. The
        # same commands run here on every OS in the matrix.
        shell: bash
        run: |
          set -euo pipefail
          uv build --out-dir smoke-dist
          uv venv "$RUNNER_TEMP/sdk-smoke"
          BIN="$RUNNER_TEMP/sdk-smoke/bin"
          [ -d "$BIN" ] || BIN="$RUNNER_TEMP/sdk-smoke/Scripts"
          # [scaffold] rides the wheel install too: `new` from the installed
          # wheel renders through the packaged copier template (WS2). The glob
          # must expand BEFORE the extras suffix is appended: a quoted
          # glob-plus-extras reaches uv as a literal and it refuses with
          # "The wheel filename '*.whl' is invalid".
          WHEEL="$(echo smoke-dist/*.whl)"
          uv pip install --python "$RUNNER_TEMP/sdk-smoke" "${WHEEL}[scaffold]"
          "$BIN/benchweave-sdk" --version
          # PR #90 carry-forward row R1: the server console script exists on
          # every default install (extras cannot gate entry points) — smoke
          # it here so a packaging regression that breaks it fails at PR
          # time, not at release. --version needs no [server] extra.
          "$BIN/benchweave-sdk-server" --version
          "$BIN/benchweave-sdk" new "$RUNNER_TEMP/smoke-example" --with-ui
          "$BIN/benchweave-sdk" check "$RUNNER_TEMP/smoke-example/src/example_plugin/descriptor.json"
          # B-F5 completeness: the wheel render must equal the committed fixture
          # byte-for-byte, so a force-include regression dropping ANY template
          # member (vectors.json, ...) reddens here instead of shipping green.
          "$BIN/python" - "$RUNNER_TEMP/smoke-example" <<'PY'
          import sys
          from pathlib import Path

          rendered = Path(sys.argv[1]).resolve()
          fixture = Path("tests/fixtures/scaffold_expected/ui")
          a = {
              p.relative_to(rendered).as_posix(): p.read_bytes()
              for p in rendered.rglob("*")
              if p.is_file() and "__pycache__" not in p.parts
          }
          b = {
              p.relative_to(fixture).as_posix(): p.read_bytes()
              for p in fixture.rglob("*")
              if p.is_file() and "__pycache__" not in p.parts
          }
          assert sorted(a) == sorted(b), (
              f"file sets differ; missing: {sorted(set(b) - set(a))}, "
              f"unexpected: {sorted(set(a) - set(b))}"
          )
          for key in sorted(b):
              assert a[key] == b[key], f"bytes differ: {key}"
          print(f"wheel render == fixture ({len(b)} files)")
          PY
          "$BIN/benchweave-sdk" sync-standards --check

  browser:
    # The axe/Playwright lane (I2a NFR-Q1): the real app factory over the
    # mock transport, every page template in both themes (data-theme
    # forced), the doctored-template RED control and the plot-hydration
    # assertions.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --locked --extra test --extra server
      - name: Install chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser lane
        run: uv run pytest -q -m browser tests/server

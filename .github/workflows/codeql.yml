name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 1 * * 4"

jobs:
  analyze:
    # CR-59 platform detection baseline: CodeQL for Python on every lane
    # repository. Platform-owned detection quality is not this repo's claim
    # (disclosed, PRD §9 Q21); the configuration is.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

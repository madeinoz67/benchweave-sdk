[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benchweave-sdk"
version = "0.6.0"
description = "Offline authoring and conformance tools for BenchWeave OTDP device plugins."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["benchweave", "otdp", "device-plugin", "conformance", "scaffold"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.3,<9",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "rfc3339-validator>=0.1.4",
  "rfc3987>=1.3.8",
  "rich>=14,<16",
  "textual>=8.2,<9",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
# Publisher signing at package time (owner ruling 2026-10-02, issue #223):
# optional so the keyless default never loads the signing stack.
signing = ["cryptography>=45"]
# The server host (owner ruling 2026-10-02, issue #309): the standalone tree
# folded into this distribution as one optional extra — the default install
# stays minimal and never imports the web stack (the graceful-degrade guard
# in benchweave_sdk_server.cli is what a default install meets).
server = [
  "fastapi>=0.141.1",
  # fastmcp plain, no extra: 4.0.3 publishes none, so `fastmcp[server]`
  # named a dependency that does not exist (the I1 accepted-risk this
  # fold fixes); the exact pin holds the tool-schema pinning internals
  # benchweave_sdk_server.mcp relies on.
  "fastmcp==4.0.3",
  "jinja2>=3.1",
  "uvicorn>=0.52.4",
]

[project.urls]
Homepage = "https://madeinoz67.github.io/benchweave-sdk/"
Documentation = "https://madeinoz67.github.io/benchweave-sdk/docs/"
Repository = "https://github.com/madeinoz67/benchweave-sdk"
Changelog = "https://github.com/madeinoz67/benchweave-sdk/blob/main/CHANGELOG.md"

[project.scripts]
benchweave-sdk = "benchweave_sdk.cli:main"
benchweave-sdk-server = "benchweave_sdk_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchweave_sdk", "src/benchweave_sdk_server"]

[tool.hatch.build.targets.wheel.force-include]
# Packaged so an installed SDK can verify its vendored tree offline
# (`benchweave-sdk sync-standards --check` without a repository checkout).
"standards-lock.json" = "benchweave_sdk/standards-lock.json"

[tool.hatch.build.targets.sdist]
# Root files are anchored (/name): hatchling matches include patterns with
# gitignore depth semantics, so an unanchored "README.md" also picked up
# .claude/deep-review/README.md. "/src" is anchored for the same reason —
# an unanchored "src" would also match every src/ subtree at depth.
include = ["/src", "/pyproject.toml", "/README.md", "/hatch_build.py", "/standards-lock.json"]

[tool.hatch.build.hooks.custom]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
  "types-jsonschema>=4.26.0.20260518",
  # Dev-only so CI mypy resolves the optional signing imports; the published
  # wheel keeps cryptography optional via the `signing` extra (issue #223).
  "cryptography>=45",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

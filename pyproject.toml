[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benchweave-sdk"
version = "0.1.0"
description = "Offline authoring and conformance tools for BenchWeave OTDP device plugins."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = ["jsonschema>=4.23", "referencing>=0.35", "rfc3339-validator>=0.1.4", "rfc3987>=1.3.8"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
benchweave-sdk = "benchweave_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchweave_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "hatch_build.py"]

[tool.hatch.build.hooks.custom]

<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="bw-sdk-logo-title">
  <title id="bw-sdk-logo-title">BenchWeave SDK mark: dashed amber hexagon with an amber-under/blue-over wire weave</title>
  <style>.strand{stroke:#4C6FFF}@media (prefers-color-scheme: dark){.strand{stroke:#8AA0FF}}</style>
  <!-- SDK sub-brand per the public-site styleguide v0.2: dashed hexagon = "blueprint, not a running system"; the weave is the same as the gateway mark. Colours fixed in both themes except the blue strand (dark: #8AA0FF). -->
  <path d="M12 2 L20.66 7 L20.66 17 L12 22 L3.34 17 L3.34 7 Z" stroke="#FFB020" stroke-width="1.4" stroke-dasharray="2.6 2.3"/>
  <path d="M7 7 L10.6 10.6 A2 2 0 0 1 13.4 13.4 L17 17" stroke="#FFB020" stroke-width="1.8" stroke-linecap="round"/>
  <path class="strand" d="M17 7 L7 17" stroke="#4C6FFF" stroke-width="1.8" stroke-linecap="round"/>
</svg>

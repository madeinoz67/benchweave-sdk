# The BenchWeave SDK repository IS the copier template (issue #347 WS2):
# `new` renders from the packaged copy of this tree; `copier update` clones
# the tagged repository. No update scripts of any kind ship here: copier
# gates template scripts behind --trust/--UNSAFE, and this scaffold never
# requires them.
package_name:
  type: str
  default: example_plugin
with_ui:
  type: bool
  default: false
# Row f (issue #568): the provider-transport variant. The serial-stream
# default is unchanged; true renders the custom transport with the banked
# FTDI control contract pinned, provider-shaped builders and adapter, and
# NO vectors.json — the mock's stream-only dialects cannot script control
# ops, so the rehearsal is the shipped driver double (the amended #568
# record's §3), never a third vectors dialect.
provider_transport:
  type: bool
  default: false
sdk_version:
  type: str
otdp_version:
  type: str
_subdirectory: template
# The serial default excludes the provider contract; the provider shape
# ships BOTH its contract and its vectors.json (copier 9 renders each
# `_exclude` value as jinja; the pattern is the DESTINATION name,
# `.jinja` stripped, relative to the subdirectory root). The exclusion
# re-applies on `copier update`, so the serial shape never grows the
# contract file.
_exclude:
  - "{% if not provider_transport %}ftdi-control-provider.json{% endif %}"
# The globstars are load-bearing (spike-proven at update time): a single
# `*` does NOT cross `/` in copier's update-time skip matching, so `src/*`
# left src/<pkg>/adapter.py unprotected — the 3-way merge could push
# template bytes over real device code. `src/**` and `tests/**` protect
# the whole subtree; exact-name members (pyproject, README, CLAUDE.md)
# match either way. Deleting this list makes owned-file preservation fail
# (pinned by test_skip_list_is_load_bearing_on_update).
_skip_if_exists: [pyproject.toml, README.md, CLAUDE.md, tests/**, src/**]

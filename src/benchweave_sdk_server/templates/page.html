{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ plugin.package }}{% endblock %}
{% block content %}
<section class="panel bw-page" id="page-{{ page.id }}"
         data-bw-page-id="{{ page.id }}"
         data-bw-page-kind="{{ page.kind }}"
         data-bw-page-severity="{{ severity }}">
  <h1>{{ page.title }} <span class="page-severity" data-bw-severity="{{ severity }}">{{ severity }}</span></h1>
  <div id="page-readings"
       hx-get="/pages/{{ page.id }}/readings"
       hx-trigger="every 2s"
       hx-swap="innerHTML">
    {% include "page-readings.html" %}
  </div>
  {% if plots is defined and plots %}{{ plots }}{% endif %}
</section>
{% endblock %}

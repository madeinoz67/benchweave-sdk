<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BenchWeave SDK server{% endblock %}</title>
  <meta name="htmx-config" content='{"allowEval": false, "selfRequestsOnly": true}'>
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/themes.css">
  <link rel="stylesheet" href="/assets/globals.css">
  <link rel="stylesheet" href="/assets/standalone.css">
  <link rel="stylesheet" href="/assets/uplot.css">
  <script src="/assets/htmx.min.js" defer></script>
  <script src="/assets/sse.js" defer></script>
  <script src="/assets/uplot.min.js" defer></script>
  <script src="/assets/bw-plot.js" defer></script>
</head>
<body>
  <div class="banner-region" title="Absent gateway guarantees: {{ absent | join(', ') }}">
    {{ mode_banner }}
  </div>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>plugin <strong>{{ plugin.package }}</strong> {{ plugin.plugin_version }}</span>
    <span>descriptor <code>{{ plugin.descriptor_sha256[:12] }}</code></span>
  </footer>
</body>
</html>
